<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小艺 AI 助手</title>
    <style>
        :root { color-scheme: light; font-family: "Microsoft YaHei", sans-serif; }
        body { margin: 0; min-height: 100vh; background: #f5f7fb; color: #1f2937; }
        .chat-app { display: flex; flex-direction: column; width: min(720px, 100%); min-height: 100vh; margin: 0 auto; background: #fff; box-shadow: 0 0 30px #dbe3f055; }
        header { padding: 20px 24px; font-size: 20px; font-weight: 700; border-bottom: 1px solid #e5e7eb; }
        #messages { flex: 1; padding: 24px; overflow-y: auto; }
        .message { display: flex; margin-bottom: 16px; }
        .message.user { justify-content: flex-end; }
        .bubble { max-width: 78%; padding: 12px 14px; border-radius: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
        .assistant .bubble { background: #f1f5f9; border-top-left-radius: 4px; }
        .user .bubble { color: #fff; background: #2563eb; border-top-right-radius: 4px; }
        .composer { display: flex; gap: 10px; padding: 16px 24px; border-top: 1px solid #e5e7eb; }
        #message { flex: 1; min-width: 0; padding: 11px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
        button { padding: 0 18px; color: #fff; background: #2563eb; border: 0; border-radius: 8px; font: inherit; cursor: pointer; }
        button:disabled { opacity: .6; cursor: not-allowed; }
        .spinner { width: 18px; height: 18px; border: 3px solid #cbd5e1; border-top-color: #2563eb; border-radius: 50%; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<main class="chat-app">
    <header>小艺 AI 助手</header>
    <section id="messages" aria-live="polite"></section>
    <form id="chat-form" class="composer">
        <input id="message" name="message" placeholder="输入你的问题" autocomplete="off" required>
        <button id="send-button" type="submit">发送</button>
    </form>
</main>

<script>
    const form = document.querySelector('#chat-form');
    const input = document.querySelector('#message');
    const messages = document.querySelector('#messages');
    const sendButton = document.querySelector('#send-button');

    function addMessage(role, content = '') {
        const message = document.createElement('div');
        message.className = `message ${role}`;
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = content;
        message.append(bubble);
        messages.append(message);
        messages.scrollTop = messages.scrollHeight;
        return bubble;
    }

    function showSpinner(bubble) {
        const spinner = document.createElement('div');
        spinner.className = 'spinner';
        bubble.replaceChildren(spinner);
    }

    function appendSseEvents(buffer, onContent) {
        const events = buffer.split(/\r?\n\r?\n/);
        const remaining = events.pop();
        for (const event of events) {
            const data = event.split(/\r?\n/)
                .filter(line => line.startsWith('data:'))
                .map(line => line.slice(5).trimStart())
                .join('\n');
            if (data) {
                onContent(data);
            }
        }
        return remaining;
    }

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const question = input.value.trim();
        if (!question) return;

        addMessage('user', question);
        input.value = '';
        input.disabled = true;
        sendButton.disabled = true;

        const answer = addMessage('assistant');
        showSpinner(answer);
        let receivedContent = false;

        try {
            const response = await fetch(`/chat/stream?message=${encodeURIComponent(question)}`);
            if (!response.ok || !response.body) {
                throw new Error(`请求失败：${response.status}`);
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            while (true) {
                const { done, value } = await reader.read();
                buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
                buffer = appendSseEvents(buffer, (content) => {
                    if (!receivedContent) {
                        answer.textContent = '';
                        receivedContent = true;
                    }
                    answer.textContent += content;
                    messages.scrollTop = messages.scrollHeight;
                });
                if (done) break;
            }
        } catch (error) {
            answer.textContent = `抱歉，暂时无法获取回答：${error.message}`;
        } finally {
            input.disabled = false;
            sendButton.disabled = false;
            input.focus();
        }
    });
</script>
</body>
</html>
