spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  application:
    name: xiaoyi-ai
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/xiaoyi_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  ai:
    openai:   # 改成 openai，因为 deepseek API 兼容 OpenAI
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.7
      embedding:
        base-url: https://dashscope.aliyuncs.com/compatible-mode
        api-key: ${AI_DASHSCOPE_API_KEY}
        options:
          model: text-embedding-v4
          dimensions: 1024
      image:
        enabled: false

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG

xiaoyi:
  dashscope:
    api-key: ${AI_DASHSCOPE_API_KEY}
  knowledge:
    store-path: ./data/xiaoyi-vectors.json
    bootstrap:
      enabled: true
      state-path: ./data/xiaoyi-knowledge-sources.txt
  weather:
    amap:
      api-key: ${AMAP_WEB_SERVICE_API_KEY}
  search:
    tavily:
      api-key: ${TAVILY_API_KEY:}
  vision:
    dashscope:
      api-key: ${xiaoyi.dashscope.api-key}
      model: ${DASHSCOPE_VISION_MODEL:qwen3-vl-flash}
  image:
    dashscope:
      api-key: ${xiaoyi.dashscope.api-key}
      model: qwen-image-3.0
  speech:
    dashscope:
      api-key: ${xiaoyi.dashscope.api-key}
      model: qwen3-tts-vd-2026-01-26
      voice: qwen-tts-vd-bailian-voice-20260818130242974-c39d
      language-type: Chinese