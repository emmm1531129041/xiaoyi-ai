spring:
  application:
    name: xiaoyi-ai

  ai:
    openai:   # 改成 openai，因为 deepseek API 兼容 OpenAI
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.7
      image:
        enabled: false

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG

xiaoyi:
  dashscope:
    api-key: ${AI_DASHSCOPE_API_KEY}
  weather:
    amap:
      api-key: ${AMAP_WEB_SERVICE_API_KEY}
  search:
    tavily:
      api-key: ${TAVILY_API_KEY:}
  image:
    dashscope:
      api-key: ${xiaoyi.dashscope.api-key}
      model: qwen-image-3.0
  speech:
    dashscope:
      api-key: ${xiaoyi.dashscope.api-key}
      model: qwen3-tts-vd-2026-01-26
      voice: qwen-tts-vd-bailian-voice-20260818130242974-c39d
      language-type: Chinese
