<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小艺 AI 助手</title>
    <style>
    :root { font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; color: #1f1f1f; background: #ffffff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; background: #ffffff; }
    button, input { font: inherit; }
    .app { display: flex; width: 100%; min-height: 100dvh; background: #ffffff; }
    .sidebar { width: 300px; min-width: 230px; max-width: 460px; display: flex; flex: 0 0 auto; flex-direction: column; gap: 18px; padding: 20px 16px; color: #1e293b; background: #f8fafc; border-right: 1px solid #e2e8f0; } .sidebar-resizer { width: 6px; flex: 0 0 6px; cursor: col-resize; touch-action: none; background: transparent; transition: background .15s ease; } .sidebar-resizer:hover, body.is-resizing .sidebar-resizer { background: #c7d2fe; } body.is-resizing { user-select: none; cursor: col-resize; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 10px; font-size: 18px; font-weight: 700; }
    .brand-mark { display: grid; width: 30px; height: 30px; place-items: center; border-radius: 9px; color: #ffffff; background: linear-gradient(135deg, #4f46e5, #7c3aed); }
    .mode-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 10px; background: #e2e8f0; }
    .mode-switch button { padding: 8px 6px; border: 0; border-radius: 7px; color: #64748b; cursor: pointer; background: transparent; }
    .mode-switch button.active { color: #3730a3; background: #ffffff; box-shadow: 0 1px 3px #64748b33; }
    .chat-history { display: flex; flex: 1; min-height: 0; flex-direction: column; }
    .new-chat { width: 100%; padding: 10px 12px; border: 0; border-radius: 9px; color: #ffffff; cursor: pointer; text-align: left; background: #4f46e5; transition: background .15s ease; }
    .new-chat:hover { background: #4338ca; }
    .history-title, .history-label { margin: 22px 8px 8px; color: #64748b; font-size: 12px; }
    #conversation-list { display: flex; flex: 1; min-height: 0; flex-direction: column; gap: 3px; overflow-y: auto; }
    .conversation, .conversation-item { display: flex; align-items: center; gap: 4px; width: 100%; border-radius: 8px; color: #1e293b; }
    .conversation:hover, .conversation.active, .conversation-item:hover, .conversation-item.active { color: #3730a3; background: #e0e7ff; }
    .conversation-main { min-width: 0; flex: 1; } .conversation-select { min-width: 0; flex: 1; padding: 9px 8px; border: 0; border-radius: 8px; color: inherit; cursor: pointer; text-align: left; background: transparent; }
    .conversation-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
    .conversation-time { margin-top: 4px; color: #94a3b8; font-size: 11px; }
    .delete-conversation { width: 28px; height: 28px; flex: 0 0 auto; margin-right: 4px; border: 0; border-radius: 5px; padding: 2px 5px; color: #64748b; cursor: pointer; background: transparent; opacity: 0; transition: opacity .15s ease; }
    .conversation:hover .delete-conversation, .conversation.active .delete-conversation { opacity: 1; } .delete-conversation:hover { color: #dc2626; background: #fee2e2; }
    .chat-panel { display: flex; min-width: 0; flex: 1; min-height: 100dvh; flex-direction: column; background: #ffffff; }
    #messages, #image-results { display: flex; width: 100%; flex: 1; flex-direction: column; gap: 22px; overflow-y: auto; padding: 42px 24px 28px; } #messages[hidden], #image-results[hidden] { display: none; }
    .empty, .image-empty { max-width: 420px; margin: 15vh auto; color: #737373; text-align: center; line-height: 1.8; } .image-empty strong { display: block; margin-bottom: 6px; color: #1f1f1f; font-size: 18px; }
    .message { display: flex; width: min(100%, 820px); gap: 12px; align-items: flex-start; margin: 0 auto; }
    .message.user { flex-direction: row-reverse; } .message.user .avatar, .message.assistant .avatar { display: none; }
    .avatar { display: grid; width: 28px; height: 28px; flex: 0 0 28px; place-items: center; border-radius: 50%; color: #ffffff; font-size: 12px; font-weight: 700; background: #6747e8; }
    .message.user .avatar { background: #171717; }
    .bubble { max-width: min(84%, 760px); padding: 13px 16px; border-radius: 14px; color: #1f1f1f; font-size: 17px; line-height: 1.7; white-space: pre-wrap; background: #f4f4f4; }
    .message.assistant .bubble { position: relative; min-height: 54px; padding: 13px 48px 13px 16px; } .message.assistant .bubble.thinking { display: flex; width: auto; min-height: 0; padding: 9px 0; background: transparent; }
    .message.user .bubble { color: #1f1f1f; background: #eeeaff; }
    .speech-button, .copy-button { position: absolute; display: grid; width: 28px; height: 28px; place-items: center; border: 0; border-radius: 7px; color: #7c6bbd; cursor: pointer; background: transparent; opacity: .72; transition: background .15s ease, opacity .15s ease; }
    .copy-button { top: 7px; right: 8px; }
    .speech-button { right: 8px; bottom: 9px; }
    .speech-button:hover, .copy-button:hover { background: #e8e3fb; opacity: 1; }
    .speech-button:disabled, .copy-button:disabled { cursor: wait; opacity: .45; } .speech-button.playing { color: #6747e8; background: #e8e3fb; opacity: 1; }
    .speech-button svg, .copy-button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
    .copy-button.copied { color: #4f46e5; opacity: 1; }
    #image-results { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); align-content: start; }
    .image-card, .image-loading { width: min(100%, 820px); padding: 16px; border: 1px solid #e5e5e5; border-radius: 14px; background: #fafafa; box-shadow: 0 2px 8px rgb(0 0 0 / 4%); }
    .image-card { margin: 0 auto; } .image-prompt { margin: 0 0 12px; color: #525252; font-size: 14px; line-height: 1.6; } .image-preview { display: grid; min-height: 160px; overflow: hidden; border-radius: 10px; background: #efefef; place-items: center; } .image-preview img { max-height: 560px; object-fit: contain; } .image-link { display: inline-block; margin-top: 10px; color: #5b47d9; font-size: 13px; text-decoration: none; } .image-link:hover { text-decoration: underline; } .image-error { color: #dc2626; font-size: 14px; }
    .image-card p, .image-loading p { margin: 0 0 12px; line-height: 1.6; }
    .image-card img { display: block; width: 100%; border-radius: 10px; }
    .image-loading { display: flex; gap: 10px; align-items: center; justify-self: center; margin-top: 18vh; }
    .spinner { width: 18px; height: 18px; border: 3px solid #dedede; border-top-color: #171717; border-radius: 50%; animation: spin .75s linear infinite; }
    .thinking-dot { width: 13px; height: 13px; border-radius: 50%; background: #6747e8; animation: thinking-pulse 1s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes thinking-pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.48); opacity: .58; } }
    .composer { width: min(1040px, calc(100% - 48px)); min-height: 66px; display: flex; gap: 10px; align-items: center; margin: 0 auto 30px; padding: 12px 12px 12px 20px; border: 1px solid #e2e2e2; border-radius: 20px; background: #ffffff; box-shadow: 0 8px 28px rgb(0 0 0 / 9%); }
    #message { min-width: 0; flex: 1; padding: 10px 0; border: 0; outline: none; color: #1f1f1f; font-size: 17px; background: transparent; }
    #send-button { display: grid; width: 36px; height: 36px; flex: 0 0 36px; place-items: center; border: 0; border-radius: 50%; color: #ffffff; cursor: pointer; font-size: 22px; font-weight: 500; line-height: 1; background: #4f46e5; } #send-button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 3.2; } .image-mode #send-button { display: block; width: auto; min-width: 88px; padding: 0 14px; border-radius: 9px; font-size: 14px; }
    #send-button:disabled { cursor: not-allowed; opacity: .45; }
    .image-mode .chat-history { display: none; } @media (max-width: 760px) { .app { flex-direction: column; } .sidebar { width: 100%; min-width: 0; max-width: none; flex: initial; gap: 12px; padding: 12px; } .sidebar-resizer { display: none; } .chat-history, .brand { display: none; } .mode-switch { width: 100%; } .chat-panel { min-height: calc(100dvh - 70px); } #messages, #image-results { padding: 24px 16px; } .composer { width: calc(100% - 24px); margin-bottom: 12px; } .bubble { max-width: 82%; } .delete-conversation { opacity: 1; } }
</style>
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="brand"><span class="brand-mark">艺</span><span>小艺 AI</span></div>
        <div class="mode-switch" role="tablist" aria-label="功能模式">
            <button class="mode-button active" type="button" data-mode="chat">聊天</button>
            <button class="mode-button" type="button" data-mode="image">生图</button>
        </div>
        <div class="chat-history">
            <button id="new-chat" class="new-chat" type="button">＋ 新建会话</button>
            <div class="history-label">聊天记录</div>
            <div id="conversation-list"></div>
        </div>
    </aside>
    <div id="sidebar-resizer" class="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="调整侧栏宽度"></div>
    <main class="chat-panel">
        <section id="messages" aria-live="polite"></section>
        <section id="image-results" aria-live="polite" hidden></section>
        <form id="chat-form" class="composer">
            <input id="message" name="message" placeholder="输入你的问题" autocomplete="off" required>
            <button id="send-button" type="submit" aria-label="发送消息" title="发送消息"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6.5 10.5 12 5l5.5 5.5"/></svg></button>
        </form>
    </main>
</div>
<script>
    const form = document.querySelector('#chat-form');
    const input = document.querySelector('#message');
    const messages = document.querySelector('#messages');
    const imageResults = document.querySelector('#image-results');
    const sendButton = document.querySelector('#send-button');
    const newChatButton = document.querySelector('#new-chat');
    const conversationList = document.querySelector('#conversation-list');
    const modeButtons = document.querySelectorAll('.mode-button');
    const sidebar = document.querySelector('.sidebar');
    const sidebarResizer = document.querySelector('#sidebar-resizer');
    const savedSidebarWidth = Number(localStorage.getItem('xiaoyi-sidebar-width'));
    if (savedSidebarWidth >= 230 && savedSidebarWidth <= 460) sidebar.style.width = `${savedSidebarWidth}px`;

    sidebarResizer.addEventListener('pointerdown', event => {
        event.preventDefault();
        document.body.classList.add('is-resizing');
        const resizeSidebar = moveEvent => {
            const maximumWidth = Math.min(460, window.innerWidth - 320);
            const width = Math.min(Math.max(moveEvent.clientX, 210), maximumWidth);
            sidebar.style.width = `${width}px`;
        };
        const stopResizing = () => {
            document.body.classList.remove('is-resizing');
            localStorage.setItem('xiaoyi-sidebar-width', String(Math.round(sidebar.getBoundingClientRect().width)));
            document.removeEventListener('pointermove', resizeSidebar);
        };
        document.addEventListener('pointermove', resizeSidebar);
        document.addEventListener('pointerup', stopResizing, { once: true });
    });
    let activeConversationId = null;
    let activeMode = 'chat';

    function addMessage(role, content = '') {
        const message = document.createElement('div');
        message.className = `message ${role}`;
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = role === 'user' ? '我' : '艺';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = content;
        message.append(avatar, bubble);
        if (role === 'assistant' && content) addAssistantActions(bubble, content);
        messages.append(message);
        messages.scrollTop = messages.scrollHeight;
        return bubble;
    }

    const speakerIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 10.25v3.5c0 .7.56 1.25 1.25 1.25H9l4.4 3.45c.66.52 1.6.05 1.6-.8V6.35c0-.85-.94-1.32-1.6-.8L9 9H6.75c-.69 0-1.25.56-1.25 1.25Z"/><path d="M17.25 9.25a4.2 4.2 0 0 1 0 5.5"/></svg>';
    const stopIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7.5" y="7.5" width="9" height="9" rx="1.5"/></svg>';
    const copyIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="10" height="10" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>';
    const copiedIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4.2 4.2L19 6.5"/></svg>';
    let activeAudio = null;
    let activeSpeechAbortController = null;
    let activeSpeechButton = null;
    let speechRequestId = 0;

    function addAssistantActions(bubble, text) {
        if (bubble.querySelector('.speech-button')) return;
        const copyButton = document.createElement('button');
        copyButton.type = 'button';
        copyButton.className = 'copy-button';
        copyButton.innerHTML = copyIcon;
        copyButton.title = '复制回复';
        copyButton.setAttribute('aria-label', '复制回复');
        copyButton.addEventListener('click', () => copyReply(text, copyButton));

        const speechButton = document.createElement('button');
        speechButton.type = 'button';
        speechButton.className = 'speech-button';
        speechButton.innerHTML = speakerIcon;
        speechButton.title = '朗读这条回复';
        speechButton.setAttribute('aria-label', '朗读这条回复');
        speechButton.addEventListener('click', () => playSpeech(text, speechButton));
        bubble.append(copyButton, speechButton);
    }

    async function copyReply(text, button) {
        try {
            await navigator.clipboard.writeText(text);
            button.classList.add('copied');
            button.innerHTML = copiedIcon;
            button.title = '已复制';
        } catch (error) { alert(`复制失败：${error.message}`); }
    }

    function resetSpeechButton(button) {
        button.classList.remove('playing');
        button.innerHTML = speakerIcon;
        button.title = '朗读这条回复';
        button.setAttribute('aria-label', '朗读这条回复');
        button.disabled = false;
    }

    function stopCurrentSpeech() {
        if (activeSpeechAbortController) activeSpeechAbortController.abort();
        if (activeAudio) {
            activeAudio.pause();
            activeAudio.currentTime = 0;
        }
        if (activeSpeechButton) resetSpeechButton(activeSpeechButton);
        activeAudio = null;
        activeSpeechAbortController = null;
        activeSpeechButton = null;
    }

    async function playSpeech(text, button) {
        if (activeSpeechButton === button) {
            speechRequestId += 1;
            stopCurrentSpeech();
            return;
        }

        const requestId = ++speechRequestId;
        stopCurrentSpeech();
        activeSpeechButton = button;
        activeSpeechAbortController = new AbortController();
        button.classList.add('playing');
        button.innerHTML = stopIcon;
        button.title = '停止朗读';
        button.setAttribute('aria-label', '停止朗读');

        try {
            const response = await fetch('/speech/synthesize', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text }),
                signal: activeSpeechAbortController.signal
            });
            if (!response.ok) throw new Error(`语音生成失败：${response.status}`);
            const { audioUrl } = await response.json();
            if (requestId !== speechRequestId) return;

            const audio = new Audio(audioUrl);
            activeAudio = audio;
            activeSpeechAbortController = null;
            audio.addEventListener('ended', () => {
                if (requestId === speechRequestId) stopCurrentSpeech();
            }, { once: true });
            await audio.play();
        } catch (error) {
            if (error.name !== 'AbortError' && requestId === speechRequestId) {
                alert(`暂时无法朗读：${error.message}`);
                stopCurrentSpeech();
            }
        }
    }

    function renderMessages(history) {
        messages.replaceChildren();
        if (!history.length) {
            const empty = document.createElement('div');
            empty.className = 'empty';
            empty.textContent = '你好，我是小艺。\n开始一段新的对话吧～';
            messages.append(empty);
            return;
        }
        history.forEach(item => addMessage(item.role, item.content));
    }

    function renderImageEmpty() {
        imageResults.replaceChildren();
        const empty = document.createElement('div');
        empty.className = 'image-empty';
        empty.innerHTML = '<strong>百炼生图</strong>描述你想看到的画面，例如：\n“水彩风格的江南雨巷，傍晚，有一只橘猫”。';
        imageResults.append(empty);
    }

    function addImageCard(prompt) {
        if (imageResults.querySelector('.image-empty')) imageResults.replaceChildren();
        const card = document.createElement('article');
        card.className = 'image-card';
        const promptText = document.createElement('p');
        promptText.className = 'image-prompt';
        promptText.textContent = prompt;
        const preview = document.createElement('div');
        preview.className = 'image-preview';
        showImageLoading(preview);
        card.append(promptText, preview);
        imageResults.append(card);
        imageResults.scrollTop = imageResults.scrollHeight;
        return { card, preview };
    }

    function renderConversations(conversations) {
        conversationList.replaceChildren();
        conversations.forEach(conversation => {
            const item = document.createElement('div');
            item.className = `conversation ${conversation.id === activeConversationId ? 'active' : ''}`;

            const selectButton = document.createElement('button');
            selectButton.type = 'button';
            selectButton.className = 'conversation-select';
            const title = document.createElement('div');
            title.className = 'conversation-title';
            title.textContent = conversation.title;
            const time = document.createElement('div');
            time.className = 'conversation-time';
            time.textContent = new Date(conversation.updatedAt).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            selectButton.append(title, time);
            selectButton.addEventListener('click', () => selectConversation(conversation.id));

            const deleteButton = document.createElement('button');
            deleteButton.type = 'button';
            deleteButton.className = 'delete-conversation';
            deleteButton.textContent = '×';
            deleteButton.title = '删除会话';
            deleteButton.setAttribute('aria-label', '删除会话');
            deleteButton.addEventListener('click', () => deleteConversation(conversation.id));

            item.append(selectButton, deleteButton);
            conversationList.append(item);
        });
    }

    async function refreshConversations() {
        const response = await fetch('/chat/conversations');
        const conversations = await response.json();
        renderConversations(conversations);
        return conversations;
    }

    async function selectConversation(conversationId) {
        activeConversationId = conversationId;
        localStorage.setItem('xiaoyi-active-conversation', conversationId);
        const response = await fetch(`/chat/conversations/${encodeURIComponent(conversationId)}/messages`);
        renderMessages(await response.json());
        await refreshConversations();
    }

    async function createConversation() {
        const response = await fetch('/chat/conversations', { method: 'POST' });
        const conversation = await response.json();
        activeConversationId = conversation.id;
        localStorage.setItem('xiaoyi-active-conversation', activeConversationId);
        renderMessages([]);
        await refreshConversations();
        input.focus();
    }

    async function deleteConversation(conversationId) {
        if (sendButton.disabled) return;
        const response = await fetch(`/chat/conversations/${encodeURIComponent(conversationId)}`, { method: 'DELETE' });
        if (!response.ok) {
            alert('删除失败，请稍后重试。');
            return;
        }

        const conversations = await refreshConversations();
        if (conversationId !== activeConversationId) return;

        const nextConversation = conversations[0];
        if (nextConversation) {
            await selectConversation(nextConversation.id);
        } else {
            await createConversation();
        }
    }

    function setMode(mode) {
        activeMode = mode;
        const imageMode = mode === 'image';
        document.body.classList.toggle('image-mode', imageMode);
        messages.hidden = imageMode;
        imageResults.hidden = !imageMode;
        input.placeholder = imageMode ? '描述你想生成的图片' : '输入你的问题';
        sendButton.innerHTML = imageMode ? '生成图片' : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6.5 10.5 12 5l5.5 5.5"/></svg>';
        sendButton.setAttribute('aria-label', imageMode ? '生成图片' : '发送消息');
        sendButton.title = imageMode ? '生成图片' : '发送消息';
        modeButtons.forEach(button => button.classList.toggle('active', button.dataset.mode === mode));
        input.focus();
    }

    function showSpinner(container) {
        container.classList.add('thinking');
        const thinkingDot = document.createElement('div');
        thinkingDot.className = 'thinking-dot';
        container.replaceChildren(thinkingDot);
    }

    function showImageLoading(container) {
        const loading = document.createElement('div');
        loading.className = 'image-loading';
        const spinner = document.createElement('div');
        spinner.className = 'spinner';
        const text = document.createElement('span');
        text.textContent = '正在生成图片，通常需要 1～3 分钟…';
        loading.append(spinner, text);
        container.replaceChildren(loading);
    }

    function appendSseEvents(buffer, onContent) {
        const events = buffer.split(/\r?\n\r?\n/);
        const remaining = events.pop();
        for (const event of events) {
            const data = event.split(/\r?\n/)
                .filter(line => line.startsWith('data:'))
                .map(line => line.slice(5).trimStart())
                .join('\n');
            if (data) onContent(data);
        }
        return remaining;
    }

    async function generateImage(prompt) {
        const { card, preview } = addImageCard(prompt);
        input.value = '';
        input.disabled = true;
        sendButton.disabled = true;

        try {
            const response = await fetch('/images/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt })
            });
            if (!response.ok) throw new Error(`请求失败：${response.status}`);

            const result = await response.json();
            const image = document.createElement('img');
            image.src = result.imageUrl;
            image.alt = prompt;
            preview.replaceChildren(image);

            const link = document.createElement('a');
            link.className = 'image-link';
            link.href = result.imageUrl;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.textContent = '在新标签页打开原图';
            card.append(link);
        } catch (error) {
            preview.replaceChildren();
            const message = document.createElement('span');
            message.className = 'image-error';
            message.textContent = `生成失败：${error.message}`;
            preview.append(message);
        } finally {
            input.disabled = false;
            sendButton.disabled = false;
            input.focus();
            imageResults.scrollTop = imageResults.scrollHeight;
        }
    }

    newChatButton.addEventListener('click', createConversation);
    modeButtons.forEach(button => button.addEventListener('click', () => setMode(button.dataset.mode)));

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const question = input.value.trim();
        if (!question || (activeMode === 'chat' && !activeConversationId)) return;
        if (activeMode === 'image') {
            await generateImage(question);
            return;
        }

        if (messages.querySelector('.empty')) messages.replaceChildren();
        addMessage('user', question);
        input.value = '';
        input.disabled = true;
        sendButton.disabled = true;
        const answer = addMessage('assistant');
        showSpinner(answer);
        let receivedContent = false;

        try {
            const response = await fetch(`/chat/stream?message=${encodeURIComponent(question)}&conversationId=${encodeURIComponent(activeConversationId)}`);
            if (!response.ok || !response.body) throw new Error(`请求失败：${response.status}`);

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            while (true) {
                const { done, value } = await reader.read();
                if (value) buffer += decoder.decode(value, { stream: true });
                if (done) buffer += decoder.decode();
                buffer = appendSseEvents(buffer, (content) => {
                    if (!receivedContent) {
                        answer.classList.remove('thinking');
                        answer.textContent = '';
                        receivedContent = true;
                    }
                    answer.textContent += content;
                    messages.scrollTop = messages.scrollHeight;
                });
                if (done) break;
            }
        } catch (error) {
            answer.classList.remove('thinking');
            answer.textContent = `抱歉，暂时无法获取回答：${error.message}`;
        } finally {
            if (receivedContent) addAssistantActions(answer, answer.textContent);
            input.disabled = false;
            sendButton.disabled = false;
            input.focus();
            await refreshConversations();
        }
    });

    (async () => {
        renderImageEmpty();
        const conversations = await refreshConversations();
        const savedConversationId = localStorage.getItem('xiaoyi-active-conversation');
        const current = conversations.find(item => item.id === savedConversationId) || conversations[0];
        if (current) await selectConversation(current.id);
        else await createConversation();
    })();
</script>
