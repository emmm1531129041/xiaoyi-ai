<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小艺 AI 助手</title>
    <style>
        :root { color-scheme: light; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: #eef2ff; color: #1e293b; }
        .app { display: flex; width: min(1120px, 100%); min-height: 100vh; margin: auto; background: #fff; box-shadow: 0 0 40px #94a3b833; }
        .sidebar { display: flex; flex: 0 0 260px; flex-direction: column; padding: 18px 12px; background: #f8fafc; border-right: 1px solid #e2e8f0; }
        .brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 20px; font-weight: 700; font-size: 18px; }
        .brand-mark { display: grid; width: 30px; height: 30px; color: #fff; background: linear-gradient(135deg, #4f46e5, #7c3aed); border-radius: 9px; place-items: center; }
        .mode-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: #e2e8f0; border-radius: 10px; }
        .mode-button { padding: 8px; color: #64748b; background: transparent; border: 0; border-radius: 7px; font: inherit; font-size: 13px; cursor: pointer; }
        .mode-button.active { color: #3730a3; background: #fff; box-shadow: 0 1px 3px #64748b33; }
        .chat-history { display: flex; flex: 1; flex-direction: column; min-height: 0; }
        .new-chat { width: 100%; margin-top: 14px; padding: 10px 12px; color: #fff; background: #4f46e5; border: 0; border-radius: 9px; font: inherit; cursor: pointer; }
        .new-chat:hover { background: #4338ca; }
        .history-label { margin: 22px 10px 8px; color: #64748b; font-size: 12px; }
        #conversation-list { display: flex; flex: 1; flex-direction: column; gap: 4px; overflow-y: auto; }
        .conversation { display: flex; align-items: center; gap: 2px; border-radius: 8px; }
        .conversation:hover, .conversation.active { background: #e0e7ff; color: #3730a3; }
        .conversation-select { flex: 1; min-width: 0; padding: 10px; text-align: left; color: inherit; background: transparent; border: 0; border-radius: 8px; font: inherit; cursor: pointer; }
        .conversation-title { overflow: hidden; font-size: 14px; text-overflow: ellipsis; white-space: nowrap; }
        .conversation-time { margin-top: 3px; color: #94a3b8; font-size: 11px; }
        .delete-conversation { width: 28px; height: 28px; margin-right: 5px; color: #64748b; background: transparent; border: 0; border-radius: 6px; font-size: 20px; line-height: 1; cursor: pointer; opacity: 0; transition: opacity .15s, background .15s; }
        .conversation:hover .delete-conversation, .conversation.active .delete-conversation { opacity: 1; }
        .delete-conversation:hover { color: #dc2626; background: #fee2e2; }
        .chat-panel { display: flex; flex: 1; flex-direction: column; min-width: 0; }
        .chat-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 24px; border-bottom: 1px solid #e2e8f0; }
        .chat-header h1 { margin: 0; font-size: 18px; }
        .status { color: #16a34a; font-size: 13px; }
        #messages, #image-results { flex: 1; padding: 28px clamp(16px, 4vw, 42px); overflow-y: auto; }
        #messages[hidden], #image-results[hidden] { display: none; }
        .empty { max-width: 360px; margin: 15vh auto; color: #64748b; text-align: center; line-height: 1.8; }
        .image-empty { max-width: 420px; margin: 15vh auto; color: #64748b; text-align: center; line-height: 1.8; }
        .image-empty strong { display: block; margin-bottom: 6px; color: #3730a3; font-size: 18px; }
        .message { display: flex; gap: 9px; margin-bottom: 18px; }
        .message.user { flex-direction: row-reverse; }
        .avatar { display: grid; flex: 0 0 30px; width: 30px; height: 30px; color: #fff; background: #6366f1; border-radius: 50%; font-size: 12px; place-items: center; }
        .user .avatar { background: #0f172a; }
        .bubble { max-width: min(78%, 580px); padding: 11px 14px; line-height: 1.65; background: #f1f5f9; border-radius: 4px 14px 14px; white-space: pre-wrap; word-break: break-word; }
        .user .bubble { color: #fff; background: #4f46e5; border-radius: 14px 4px 14px 14px; }
        .image-card { max-width: min(100%, 640px); margin: 0 auto 24px; padding: 14px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; }
        .image-prompt { margin: 0 0 12px; color: #475569; font-size: 14px; line-height: 1.6; }
        .image-preview { display: grid; min-height: 160px; background: #eef2ff; border-radius: 10px; place-items: center; overflow: hidden; }
        .image-preview img { display: block; width: 100%; max-height: 560px; object-fit: contain; }
        .image-loading { display: grid; justify-items: center; gap: 10px; color: #64748b; font-size: 13px; }
        .image-link { display: inline-block; margin-top: 10px; color: #4f46e5; font-size: 13px; text-decoration: none; }
        .image-link:hover { text-decoration: underline; }
        .image-error { color: #dc2626; font-size: 14px; }
        .composer { display: flex; gap: 10px; padding: 16px clamp(16px, 4vw, 28px); border-top: 1px solid #e2e8f0; }
        #message { flex: 1; min-width: 0; padding: 11px 13px; border: 1px solid #cbd5e1; border-radius: 9px; outline: none; font: inherit; }
        #message:focus { border-color: #6366f1; box-shadow: 0 0 0 3px #e0e7ff; }
        #send-button { padding: 0 18px; color: #fff; background: #4f46e5; border: 0; border-radius: 9px; font: inherit; cursor: pointer; }
        #send-button:disabled { cursor: not-allowed; opacity: .55; }
        .spinner { width: 17px; height: 17px; border: 3px solid #cbd5e1; border-top-color: #4f46e5; border-radius: 50%; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .image-mode .chat-history { display: none; }
        @media (max-width: 700px) { .app { display: block; } .sidebar { height: 165px; padding-bottom: 8px; border-right: 0; border-bottom: 1px solid #e2e8f0; } .chat-history { margin-top: 0; } #conversation-list { flex-direction: row; } .conversation { min-width: 145px; } .delete-conversation { opacity: 1; } .history-label { margin-top: 12px; } .chat-panel { min-height: calc(100vh - 165px); } .image-mode .sidebar { height: auto; } .image-mode .chat-panel { min-height: calc(100vh - 118px); } }
    </style>
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="brand"><span class="brand-mark">艺</span><span>小艺 AI</span></div>
        <div class="mode-switch" role="tablist" aria-label="功能模式">
            <button class="mode-button active" type="button" data-mode="chat">聊天</button>
            <button class="mode-button" type="button" data-mode="image">生图</button>
        </div>
        <div class="chat-history">
            <button id="new-chat" class="new-chat" type="button">＋ 新建会话</button>
            <div class="history-label">聊天记录</div>
            <div id="conversation-list"></div>
        </div>
    </aside>
    <main class="chat-panel">
        <header class="chat-header"><h1 id="panel-title">和小艺聊天</h1><span id="panel-status" class="status">● 在线</span></header>
        <section id="messages" aria-live="polite"></section>
        <section id="image-results" aria-live="polite" hidden></section>
        <form id="chat-form" class="composer">
            <input id="message" name="message" placeholder="输入你的问题" autocomplete="off" required>
            <button id="send-button" type="submit">发送</button>
        </form>
    </main>
</div>
<script>
    const form = document.querySelector('#chat-form');
    const input = document.querySelector('#message');
    const messages = document.querySelector('#messages');
    const imageResults = document.querySelector('#image-results');
    const sendButton = document.querySelector('#send-button');
    const newChatButton = document.querySelector('#new-chat');
    const conversationList = document.querySelector('#conversation-list');
    const modeButtons = document.querySelectorAll('.mode-button');
    const panelTitle = document.querySelector('#panel-title');
    const panelStatus = document.querySelector('#panel-status');
    let activeConversationId = null;
    let activeMode = 'chat';

    function addMessage(role, content = '') {
        const message = document.createElement('div');
        message.className = `message ${role}`;
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = role === 'user' ? '我' : '艺';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = content;
        message.append(avatar, bubble);
        messages.append(message);
        messages.scrollTop = messages.scrollHeight;
        return bubble;
    }

    function renderMessages(history) {
        messages.replaceChildren();
        if (!history.length) {
            const empty = document.createElement('div');
            empty.className = 'empty';
            empty.textContent = '你好，我是小艺。\n开始一段新的对话吧～';
            messages.append(empty);
            return;
        }
        history.forEach(item => addMessage(item.role, item.content));
    }

    function renderImageEmpty() {
        imageResults.replaceChildren();
        const empty = document.createElement('div');
        empty.className = 'image-empty';
        empty.innerHTML = '<strong>百炼生图</strong>描述你想看到的画面，例如：\n“水彩风格的江南雨巷，傍晚，有一只橘猫”。';
        imageResults.append(empty);
    }

    function addImageCard(prompt) {
        if (imageResults.querySelector('.image-empty')) imageResults.replaceChildren();
        const card = document.createElement('article');
        card.className = 'image-card';
        const promptText = document.createElement('p');
        promptText.className = 'image-prompt';
        promptText.textContent = prompt;
        const preview = document.createElement('div');
        preview.className = 'image-preview';
        showImageLoading(preview);
        card.append(promptText, preview);
        imageResults.append(card);
        imageResults.scrollTop = imageResults.scrollHeight;
        return { card, preview };
    }

    function renderConversations(conversations) {
        conversationList.replaceChildren();
        conversations.forEach(conversation => {
            const item = document.createElement('div');
            item.className = `conversation ${conversation.id === activeConversationId ? 'active' : ''}`;

            const selectButton = document.createElement('button');
            selectButton.type = 'button';
            selectButton.className = 'conversation-select';
            const title = document.createElement('div');
            title.className = 'conversation-title';
            title.textContent = conversation.title;
            const time = document.createElement('div');
            time.className = 'conversation-time';
            time.textContent = new Date(conversation.updatedAt).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            selectButton.append(title, time);
            selectButton.addEventListener('click', () => selectConversation(conversation.id));

            const deleteButton = document.createElement('button');
            deleteButton.type = 'button';
            deleteButton.className = 'delete-conversation';
            deleteButton.textContent = '×';
            deleteButton.title = '删除会话';
            deleteButton.setAttribute('aria-label', '删除会话');
            deleteButton.addEventListener('click', () => deleteConversation(conversation.id));

            item.append(selectButton, deleteButton);
            conversationList.append(item);
        });
    }

    async function refreshConversations() {
        const response = await fetch('/chat/conversations');
        const conversations = await response.json();
        renderConversations(conversations);
        return conversations;
    }

    async function selectConversation(conversationId) {
        activeConversationId = conversationId;
        localStorage.setItem('xiaoyi-active-conversation', conversationId);
        const response = await fetch(`/chat/conversations/${encodeURIComponent(conversationId)}/messages`);
        renderMessages(await response.json());
        await refreshConversations();
    }

    async function createConversation() {
        const response = await fetch('/chat/conversations', { method: 'POST' });
        const conversation = await response.json();
        activeConversationId = conversation.id;
        localStorage.setItem('xiaoyi-active-conversation', activeConversationId);
        renderMessages([]);
        await refreshConversations();
        input.focus();
    }

    async function deleteConversation(conversationId) {
        if (sendButton.disabled) return;
        const response = await fetch(`/chat/conversations/${encodeURIComponent(conversationId)}`, { method: 'DELETE' });
        if (!response.ok) {
            alert('删除失败，请稍后重试。');
            return;
        }

        const conversations = await refreshConversations();
        if (conversationId !== activeConversationId) return;

        const nextConversation = conversations[0];
        if (nextConversation) {
            await selectConversation(nextConversation.id);
        } else {
            await createConversation();
        }
    }

    function setMode(mode) {
        activeMode = mode;
        const imageMode = mode === 'image';
        document.body.classList.toggle('image-mode', imageMode);
        messages.hidden = imageMode;
        imageResults.hidden = !imageMode;
        panelTitle.textContent = imageMode ? '用百炼生成图片' : '和小艺聊天';
        panelStatus.textContent = imageMode ? '● 百炼生图' : '● 在线';
        input.placeholder = imageMode ? '描述你想生成的图片' : '输入你的问题';
        sendButton.textContent = imageMode ? '生成图片' : '发送';
        modeButtons.forEach(button => button.classList.toggle('active', button.dataset.mode === mode));
        input.focus();
    }

    function showSpinner(container) {
        const spinner = document.createElement('div');
        spinner.className = 'spinner';
        container.replaceChildren(spinner);
    }

    function showImageLoading(container) {
        const loading = document.createElement('div');
        loading.className = 'image-loading';
        const spinner = document.createElement('div');
        spinner.className = 'spinner';
        const text = document.createElement('span');
        text.textContent = '正在生成图片，通常需要 1～3 分钟…';
        loading.append(spinner, text);
        container.replaceChildren(loading);
    }

    function appendSseEvents(buffer, onContent) {
        const events = buffer.split(/\r?\n\r?\n/);
        const remaining = events.pop();
        for (const event of events) {
            const data = event.split(/\r?\n/)
                .filter(line => line.startsWith('data:'))
                .map(line => line.slice(5).trimStart())
                .join('\n');
            if (data) onContent(data);
        }
        return remaining;
    }

    async function generateImage(prompt) {
        const { card, preview } = addImageCard(prompt);
        input.value = '';
        input.disabled = true;
        sendButton.disabled = true;

        try {
            const response = await fetch('/images/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt })
            });
            if (!response.ok) throw new Error(`请求失败：${response.status}`);

            const result = await response.json();
            const image = document.createElement('img');
            image.src = result.imageUrl;
            image.alt = prompt;
            preview.replaceChildren(image);

            const link = document.createElement('a');
            link.className = 'image-link';
            link.href = result.imageUrl;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.textContent = '在新标签页打开原图';
            card.append(link);
        } catch (error) {
            preview.replaceChildren();
            const message = document.createElement('span');
            message.className = 'image-error';
            message.textContent = `生成失败：${error.message}`;
            preview.append(message);
        } finally {
            input.disabled = false;
            sendButton.disabled = false;
            input.focus();
            imageResults.scrollTop = imageResults.scrollHeight;
        }
    }

    newChatButton.addEventListener('click', createConversation);
    modeButtons.forEach(button => button.addEventListener('click', () => setMode(button.dataset.mode)));

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const question = input.value.trim();
        if (!question || (activeMode === 'chat' && !activeConversationId)) return;
        if (activeMode === 'image') {
            await generateImage(question);
            return;
        }

        if (messages.querySelector('.empty')) messages.replaceChildren();
        addMessage('user', question);
        input.value = '';
        input.disabled = true;
        sendButton.disabled = true;
        const answer = addMessage('assistant');
        showSpinner(answer);
        let receivedContent = false;

        try {
            const response = await fetch(`/chat/stream?message=${encodeURIComponent(question)}&conversationId=${encodeURIComponent(activeConversationId)}`);
            if (!response.ok || !response.body) throw new Error(`请求失败：${response.status}`);

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            while (true) {
                const { done, value } = await reader.read();
                if (value) buffer += decoder.decode(value, { stream: true });
                if (done) buffer += decoder.decode();
                buffer = appendSseEvents(buffer, (content) => {
                    if (!receivedContent) {
                        answer.textContent = '';
                        receivedContent = true;
                    }
                    answer.textContent += content;
                    messages.scrollTop = messages.scrollHeight;
                });
                if (done) break;
            }
        } catch (error) {
            answer.textContent = `抱歉，暂时无法获取回答：${error.message}`;
        } finally {
            input.disabled = false;
            sendButton.disabled = false;
            input.focus();
            await refreshConversations();
        }
    });

    (async () => {
        renderImageEmpty();
        const conversations = await refreshConversations();
        const savedConversationId = localStorage.getItem('xiaoyi-active-conversation');
        const current = conversations.find(item => item.id === savedConversationId) || conversations[0];
        if (current) await selectConversation(current.id);
        else await createConversation();
    })();
</script>
</body>
</html>
