<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XiaoYi · AI Assistant</title>
    <link rel="stylesheet" href="/css/chat.css?v=20260823-1">
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="brand" aria-label="XiaoYi AI Assistant">
            <span class="brand-seal">艺</span>
            <div class="brand-copy">
                <span class="brand-name">XiaoYi<i></i></span>
                <span class="brand-subtitle">AI ASSISTANT</span>
                <span class="brand-tagline">东方智能伴侣</span>
            </div>
        </div>
        <div class="mode-switch" role="tablist" aria-label="功能模式">
            <button class="mode-button active" type="button" data-mode="chat">聊天</button>
            <button class="mode-button" type="button" data-mode="image">生图</button>
        </div>
        <div class="chat-history">
            <button id="new-chat" class="new-chat" type="button">＋ 新建会话</button>
            <div class="history-label">聊天记录</div>
            <div id="conversation-list"></div>
        </div>
    </aside>
    <div id="sidebar-resizer" class="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="调整侧栏宽度"></div>
    <main class="chat-panel">
        <section id="messages" aria-live="polite"></section>
        <section id="image-results" aria-live="polite" hidden></section>
        <form id="chat-form" class="composer">
            <input id="attachment-input" type="file" accept="image/jpeg,image/png,image/webp,image/gif,.pdf,.docx,.pptx,.txt,.md" hidden>
            <div id="attachment-preview" class="attachment-preview" hidden>
                <img id="attachment-preview-image" alt="待分析图片预览">
                <div id="attachment-file-preview" class="attachment-file-preview" hidden><span id="attachment-file-type"></span><span id="attachment-file-name"></span></div>
                <div id="attachment-loading" class="attachment-loading" hidden><span class="spinner"></span></div>
                <button id="attachment-remove" type="button" aria-label="移除图片" title="移除图片">×</button>
            </div>
            <div class="composer-row">
                <button id="attachment-button" class="attachment-button" type="button" aria-label="添加附件" title="添加附件">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                </button>
                <input id="message" name="message" placeholder="问问XiaoYi" autocomplete="off">
                <button id="send-button" type="submit" aria-label="发送消息" title="发送消息"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6.5 10.5 12 5l5.5 5.5"/></svg></button>
            </div>
        </form>
    </main>
    <nav id="conversation-navigator" class="conversation-navigator" aria-label="对话导航" hidden></nav>
</div>
<script src="/js/chat.js?v=20260823-2" defer></script>
</body>
</html>
