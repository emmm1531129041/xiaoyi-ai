<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XiaoYi · AI Assistant</title>
    <link rel="stylesheet" href="/css/chat.css?v=20260827-17">
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="brand" aria-label="XiaoYi AI Assistant">
            <span class="brand-name">XiaoYi<i></i></span>
            <span class="brand-subtitle">AI ASSISTANT</span>
            <span class="brand-tagline">懂你所问 · 助你所想</span>
        </div>

        <button id="new-chat" class="new-chat" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            <span>新建会话</span>
        </button>

        <nav class="mode-switch" role="tablist" aria-label="功能模式">
            <button class="mode-button active" type="button" data-mode="chat">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5a4 4 0 0 1-4 4H9l-4.5 3v-3.7A4 4 0 0 1 3 14.5v-7a4 4 0 0 1 4-4h9a4 4 0 0 1 4 4Z"/></svg>
                <span>聊天</span>
            </button>
            <button class="mode-button" type="button" data-mode="image">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.2" cy="9" r="1.35"/><path d="m4.5 17 4.7-4.5 3.2 2.9 2.2-2.1 4.9 3.7"/></svg>
                <span>生图</span>
            </button>
        </nav>

        <section class="chat-history" aria-label="最近会话">
            <div class="history-label">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.1-5.6"/><path d="M3.5 4.8v4.6h4.6M12 7v5l3 1.8"/></svg>
                <span>最近会话</span>
            </div>
            <div id="conversation-list"></div>
        </section>
    </aside>
    <div id="sidebar-resizer" class="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="调整侧栏宽度"></div>

    <main class="chat-panel">
        <section id="messages" aria-live="polite"></section>
        <section id="image-results" aria-live="polite" hidden></section>
        <form id="chat-form" class="composer">
            <input id="attachment-input" type="file" accept="image/jpeg,image/png,image/webp,image/gif,.pdf,.docx,.pptx,.txt,.md" multiple hidden>
            <div id="attachment-preview" class="attachment-preview" aria-live="polite" hidden></div>
            <div id="attachment-drop-hint" class="attachment-drop-hint" aria-hidden="true">松开以上传图片</div>
            <div class="composer-row">
                <button id="attachment-button" class="attachment-button" type="button" aria-label="添加附件" title="添加附件">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                </button>
                <input id="message" name="message" placeholder="问问 XiaoYi..." autocomplete="off">
                <button class="composer-mic" type="button" aria-label="语音输入暂未开放" title="语音输入暂未开放" disabled>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6"/></svg>
                </button>
                <button id="send-button" type="submit" aria-label="发送消息" title="发送消息"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6.5 10.5 12 5l5.5 5.5"/></svg></button>
            </div>
        </form>
    </main>
    <nav id="conversation-navigator" class="conversation-navigator" aria-label="对话导航" hidden></nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js" defer></script>
<script src="/js/chat.js?v=20260827-14" defer></script>
</body>
</html>
