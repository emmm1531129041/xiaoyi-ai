<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="XiaoYi AI 登录页面">
    <title>登录 · XiaoYi AI</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
<main class="login-page">
    <section class="brand-panel" aria-label="小艺品牌展示">
        <div class="brand-lockup">
            <span class="brand-bot" aria-hidden="true">
                <svg viewBox="0 0 28 28" fill="none"><rect x="4" y="7" width="20" height="16" rx="6" stroke="currentColor" stroke-width="2.5"/><path d="M14 3v4M11 14h.01M17 14h.01M10 19c2.4 1.7 5.6 1.7 8 0" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="14" cy="3" r="1.5" fill="currentColor"/></svg>
            </span>
            <strong>小艺</strong><span>XiaoYi AI</span>
        </div>

        <div class="title-zone">
            <div class="brand-copy">
            <p class="wordmark">小艺</p>
            <span class="wordmark-stroke"></span>
            <p>让小艺继续陪你完成接下来的事</p>
            </div>
            <p class="handwritten greeting">你好，<br>很高兴又见到你！<span>♥</span></p>
        </div>
        <p class="handwritten waiting">小艺在这里<br>一直等你～<i>↙</i></p>

        <div class="character-area">
    <!-- 原版 Animated Characters（MIT）：内部比例、坐标与层级保持来源实现，外层仅负责布局缩放。 -->
            <div class="character-stage" aria-label="四位互动角色">
                <div class="original-scene" id="characters-scene">
                    <div class="original-character original-purple" id="char-purple">
                        <div class="original-eyes" id="purple-eyes">
                            <span class="original-eye" id="purple-eye-l"><i class="original-eye-pupil" id="purple-pupil-l"></i></span>
                            <span class="original-eye" id="purple-eye-r"><i class="original-eye-pupil" id="purple-pupil-r"></i></span>
                        </div>
                    </div>
                    <div class="original-character original-black" id="char-black">
                        <div class="original-eyes" id="black-eyes">
                            <span class="original-eye" id="black-eye-l"><i class="original-eye-pupil" id="black-pupil-l"></i></span>
                            <span class="original-eye" id="black-eye-r"><i class="original-eye-pupil" id="black-pupil-r"></i></span>
                        </div>
                    </div>
                    <div class="original-character original-orange" id="char-orange">
                        <div class="original-pupils" id="orange-eyes"><i class="original-pupil" id="orange-pupil-l"></i><i class="original-pupil" id="orange-pupil-r"></i></div>
                    </div>
                    <div class="original-character original-yellow" id="char-yellow">
                        <div class="original-pupils" id="yellow-eyes"><i class="original-pupil" id="yellow-pupil-l"></i><i class="original-pupil" id="yellow-pupil-r"></i></div>
                        <i class="original-mouth" id="yellow-mouth"></i>
                    </div>
                </div>
            </div>
        </div>

        <p class="brand-footer">AI <b>×</b> KNOWLEDGE <b>×</b> EFFICIENCY <b>×</b> A BETTER YOU</p>
    </section>

    <section class="login-panel" aria-label="登录区域">
        <p class="top-slogan">更聪明的陪伴，始于每一次登录</p>
        <form class="login-card" novalidate>
            <p class="welcome-note"><span>✦</span> Good to see you again</p>
            <div class="heading">
                <h1>欢迎回来！</h1>
                <p>登录你的账号，继续探索更大的世界</p>
            </div>

            <label class="field">
                <span class="sr-only">用户名或邮箱</span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>
                <input id="account" type="text" autocomplete="username" placeholder="用户名 / 邮箱">
            </label>
            <label class="field password-field">
                <span class="sr-only">密码</span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v2"/></svg>
                <input id="password" type="password" autocomplete="current-password" placeholder="密码">
                <button class="password-toggle" type="button" aria-label="显示密码" aria-pressed="false">
                    <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
                    <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3 21 21M10.6 6.2A10.6 10.6 0 0 1 12 6c6 0 9.5 6 9.5 6a17 17 0 0 1-3.1 3.8M6.1 6.1A17.4 17.4 0 0 0 2.5 12S6 18 12 18c1.2 0 2.3-.2 3.3-.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                </button>
            </label>

            <div class="form-options">
                <label class="remember"><input type="checkbox"><span></span>记住我</label>
                <button type="button" class="text-action">忘记密码？</button>
            </div>
            <button class="submit-button" type="submit">登录 <span>→</span></button>
            <p class="register-line">还没有账号？ <button type="button" class="text-action">立即注册</button></p>
            <p class="demo-hint" role="status" aria-live="polite"></p>
        </form>
    </section>
</main>
<script src="js/login.js"></script>
</body>
</html>
